<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">

<title>彼岸花 — Lycoris radiata</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #f4e9e1;
    --ink-dim: rgba(244, 233, 225, 0.62);
    --line: rgba(244, 233, 225, 0.35);
    --chip: rgba(20, 14, 12, 0.5);
    --accent: #b3121f;
    --bg: #120806;
  }
  html, body { margin: 0; height: 100%; overflow: hidden; color: var(--ink);
    background: radial-gradient(ellipse at 50% 40%, #3a302c 0%, #1a1513 55%, #0d0a09 100%); }
  .toolbar {
    position: fixed; top: calc(20px + env(safe-area-inset-top, 0px)); right: calc(20px + env(safe-area-inset-right, 0px));
    display: flex; gap: 10px; align-items: center; flex-wrap: wrap; justify-content: flex-end;
  }
  .mode { display: flex; padding: 3px; border-radius: 999px; border: 1px solid var(--line); background: var(--chip); backdrop-filter: blur(6px); }
  .mode button {
    border: 0; background: transparent; color: var(--ink-dim); padding: 6px 14px; border-radius: 999px;
    font: 13px "Shippori Mincho", serif; letter-spacing: .12em; cursor: pointer;
  }
  .mode button[aria-pressed="true"] { background: var(--accent); color: #fff; }
  .mode button:focus-visible, #export:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  #export {
    padding: 8px 16px; border-radius: 999px;
    border: 1px solid var(--line); background: var(--chip); color: var(--ink);
    font: 13px system-ui, sans-serif; letter-spacing: .08em; cursor: pointer; backdrop-filter: blur(6px);
  }
  #export:hover { background: rgba(160,20,30,.55); }
  canvas { display: block; }
  /* イラスト調では和紙の上に墨色の文字 */
  body.illust { --ink: #3a1a12; --ink-dim: rgba(58, 26, 18, 0.7); --line: rgba(58, 26, 18, 0.3); --chip: rgba(243, 234, 216, 0.6); }
  body.illust .title, body.illust .hint { text-shadow: none; }
  /* イラストのタッチ設定パネル */
  .touch {
    position: fixed; top: calc(72px + env(safe-area-inset-top, 0px)); right: calc(20px + env(safe-area-inset-right, 0px));
    width: min(280px, calc(100vw - 32px)); max-height: calc(100% - 200px); overflow: auto;
    padding: 12px 14px; border-radius: 14px; border: 1px solid var(--line); background: var(--chip);
    backdrop-filter: blur(8px); color: var(--ink); font: 12px/1.5 system-ui, sans-serif;
    display: grid; gap: 10px;
  }
  .touch h2 { margin: 0; font: 600 13px "Shippori Mincho", serif; letter-spacing: .14em; }
  .presets { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .presets button {
    border: 1px solid var(--line); background: transparent; color: var(--ink); border-radius: 8px;
    padding: 6px 4px; font: 12px "Shippori Mincho", serif; letter-spacing: .06em; cursor: pointer;
  }
  .presets button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
  .presets button:focus-visible, .touch summary:focus-visible, .touch input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .touch details { display: grid; gap: 8px; }
  .touch summary { cursor: pointer; color: var(--ink-dim); letter-spacing: .08em; }
  .sliders { display: grid; gap: 8px; margin-top: 8px; }
  .slider { display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; align-items: center; }
  .slider label { color: var(--ink-dim); }
  .slider output { font-variant-numeric: tabular-nums; color: var(--ink-dim); }
  .slider input { grid-column: 1 / -1; width: 100%; accent-color: var(--accent); }
  @media (max-width: 600px) {
    .touch { top: auto; bottom: calc(110px + env(safe-area-inset-bottom, 0px)); max-height: 45%; }
  }
  .title {
    position: fixed; left: 28px; bottom: 26px; pointer-events: none;
    font-family: "Shippori Mincho", serif; text-shadow: 0 1px 12px rgba(0,0,0,.55);
  }
  .title h1 { margin: 0; font-size: 34px; font-weight: 700; letter-spacing: .18em; }
  .title p { margin: 4px 0 0; font-size: 13px; letter-spacing: .12em; color: var(--ink-dim); font-style: italic; }
  .hint {
    position: fixed; right: 22px; bottom: 24px; font: 12px/1.7 system-ui, sans-serif;
    color: var(--ink-dim); text-align: right; pointer-events: none; text-shadow: 0 1px 8px rgba(0,0,0,.6);
  }
  #loading {
    position: fixed; inset: 0; display: grid; place-items: center; background: var(--bg);
    font-family: "Shippori Mincho", serif; letter-spacing: .3em; font-size: 15px; color: var(--ink-dim);
    transition: opacity 1.2s ease;
  }
  #loading.done { opacity: 0; pointer-events: none; }
  @media (max-width: 600px) {
    .title { left: 16px; bottom: 64px; }
    .title h1 { font-size: 26px; }
    .hint { right: 16px; left: 16px; bottom: 14px; text-align: left; }
  }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<body>
<div id="loading">彼岸花を咲かせています…</div>
<div class="title">
  <h1>彼岸花</h1>
  <p>Lycoris radiata — 曼珠沙華</p>
</div>
<div class="hint">ドラッグ：回転　ホイール：ズーム<br>1 / 2 / 3：シネマ・スタジオ・イラスト　R：自動回転</div>
<div class="toolbar">
  <div class="mode" role="group" aria-label="表示スタイル">
    <button type="button" data-mode="cinema" aria-pressed="true">シネマ</button>
    <button type="button" data-mode="photo" aria-pressed="false">スタジオ</button>
    <button type="button" data-mode="illust" aria-pressed="false">イラスト</button>
  </div>
<button id="export" type="button">GLB で保存</button>
</div>
<section class="touch" id="touch" aria-label="イラストのタッチ" hidden>
  <h2>タッチ</h2>
  <div class="presets" role="group" aria-label="タッチのプリセット">
    <button type="button" data-touch="nihonga" aria-pressed="true">日本画</button>
    <button type="button" data-touch="anime" aria-pressed="false">アニメ</button>
    <button type="button" data-touch="watercolor" aria-pressed="false">水彩</button>
    <button type="button" data-touch="pencil" aria-pressed="false">鉛筆</button>
    <button type="button" data-touch="sumi" aria-pressed="false">墨と朱</button>
    <button type="button" data-touch="comic" aria-pressed="false">アメコミ</button>
  </div>
  <details>
    <summary>細かく調整</summary>
    <div class="sliders" id="touch-sliders"></div>
  </details>
</section>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { FullScreenQuad } from 'three/addons/postprocessing/Pass.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { BokehPass } from 'three/addons/postprocessing/BokehPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { GLTFExporter } from 'three/addons/exporters/GLTFExporter.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

// 単位: 1 = 1cm

// ---------- 乱数 ----------
function mulberry32(seed) {
  return function () {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const rng = mulberry32(20260929);
const rand = (a, b) => a + (b - a) * rng();

const UP = new THREE.Vector3(0, 1, 0);

// ---------- レンダラー ----------
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setClearColor(0x000000, 0);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.8;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(35, window.innerWidth / window.innerHeight, 0.1, 1000);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.minDistance = 6;
controls.maxDistance = 160;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.8;

// ---------- 環境光 (スタジオ) ----------
const pmrem = new THREE.PMREMGenerator(renderer);
const envTex = pmrem.fromScene(new RoomEnvironment(renderer), 0.04).texture;
scene.environment = envTex;

// ---------- 光源 ----------
// キーライトはやや後方から当て、花弁の透け感を出す
const sunDir = new THREE.Vector3(-0.55, 0.6, -0.6).normalize();
const sunColor = new THREE.Color(0xfff0e0);
const sun = new THREE.DirectionalLight(sunColor, 2.6);
sun.position.copy(sunDir).multiplyScalar(80);
sun.target.position.set(0, 38, 0);
sun.castShadow = true;
sun.shadow.mapSize.set(4096, 4096);
const sc = sun.shadow.camera;
sc.left = -12; sc.right = 12; sc.top = 12; sc.bottom = -12; sc.near = 20; sc.far = 160;
sun.shadow.bias = -0.0003;
sun.shadow.normalBias = 0.02;
sun.shadow.radius = 4;
scene.add(sun, sun.target);

const fill = new THREE.DirectionalLight(0xffffff, 1.0);
fill.position.set(40, 50, 60);
scene.add(fill);

// 後方からの輪郭光で雄しべの細い線を際立たせる
const rim = new THREE.DirectionalLight(0xffd9c4, 1.4);
rim.position.set(30, 55, -50);
scene.add(rim);

const studioLights = [sun, fill, rim];

// ---------- 薄い花弁の透過光 (サブサーフェスの近似) ----------
const transUniforms = {
  uSunDir: { value: sunDir.clone() },
  uSunColor: { value: sunColor.clone().multiplyScalar(4.2) },
};
function addTranslucency(material, strength, tint, thinEdges = false) {
  material.onBeforeCompile = (shader) => {
    shader.uniforms.uSunDir = transUniforms.uSunDir;
    shader.uniforms.uSunColor = transUniforms.uSunColor;
    shader.uniforms.uTrans = { value: strength };
    shader.uniforms.uTint = { value: new THREE.Color(tint) };
    shader.fragmentShader = shader.fragmentShader
      .replace('#include <common>', `#include <common>
        uniform vec3 uSunDir; uniform vec3 uSunColor; uniform float uTrans; uniform vec3 uTint;`)
      .replace('#include <opaque_fragment>', `
        {
          vec3 Lv = normalize((viewMatrix * vec4(uSunDir, 0.0)).xyz);
          vec3 Vv = normalize(vViewPosition);
          float through = pow(clamp(dot(-Vv, Lv), 0.0, 1.0), 3.0);
          float backside = clamp(dot(-normal, Lv), 0.0, 1.0);
          float t = (0.55 * backside + 1.1 * through) * uTrans;
          ${thinEdges ? `
          float ex = abs(fract(vMapUv.x * ${ATLAS}.0) * 2.0 - 1.0);
          t *= mix(0.7, 1.6, ex * ex) * mix(1.0, 1.3, vMapUv.y);` : ''}
          outgoingLight += diffuseColor.rgb * uTint * uSunColor * t;
        }
        #include <opaque_fragment>`);
  };
}

// ---------- 手続き的テクスチャ ----------
function canvasTex(w, h, draw, srgb = true) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  if (srgb) t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = renderer.capabilities.getMaxAnisotropy();
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  return t;
}

// 花被片: x = 幅方向, y = 長さ方向 (上が先端, 下が基部)
// 4種類の花被片を横に並べたアトラス。花被片ごとに1列を使う
// 0: 標準 / 1: 深紅で葉脈が強い / 2: 明るい緋色で基部に花粉 / 3: 盛りを過ぎ先端が褐変
const ATLAS = 4, PW = 256, PH = 2048;
const variants = [];
for (let k = 0; k < ATLAS; k++) {
  const veins = [];
  for (let i = 0; i < 70; i++) {
    veins.push({ x: rng(), w: rand(0.5, 1.6), a: rand(0.05, 0.16) * (k === 1 ? 1.6 : 1), ph: rand(0, 6.28), f: rand(2, 6) });
  }
  const spots = [];
  for (let i = 0; i < (k === 3 ? 40 : 12); i++) spots.push({ x: rng(), y: rng(), r: rand(1, k === 3 ? 6 : 3), a: rand(0.1, 0.35) });
  variants.push({ veins, spots });
}
const veinPath = (g, x0, v, h, amp) => {
  g.beginPath();
  for (let y = 0; y <= h; y += 16) {
    const x = x0 + v.x * PW + Math.sin(y / h * v.f + v.ph) * amp;
    y === 0 ? g.moveTo(x, y) : g.lineTo(x, y);
  }
  g.stroke();
};
const palettes = [
  ['#a1061a', '#c20a22', '#cc0f26', '#b00a20', '#7c0814'],
  ['#8a0416', '#a8071d', '#b50a22', '#98081c', '#640610'],
  ['#b30a1c', '#d81828', '#de1e2c', '#c2121f', '#8a0a16'],
  ['#9a0818', '#bb0c22', '#c0122a', '#8a1a1a', '#4a1a10'],
];
const petalMap = canvasTex(PW * ATLAS, PH, (g, w, h) => {
  for (let k = 0; k < ATLAS; k++) {
    const x0 = k * PW, pal = palettes[k], V = variants[k];
    g.save(); g.beginPath(); g.rect(x0, 0, PW, h); g.clip();
    const grd = g.createLinearGradient(0, 0, 0, h);
    [0, 0.15, 0.55, 0.85, 1].forEach((t, i) => grd.addColorStop(t, pal[i]));
    g.fillStyle = grd; g.fillRect(x0, 0, PW, h);
    // 縁を少し濃く
    const edge = g.createLinearGradient(x0, 0, x0 + PW, 0);
    edge.addColorStop(0, 'rgba(90,0,12,0.38)'); edge.addColorStop(0.18, 'rgba(90,0,12,0)');
    edge.addColorStop(0.82, 'rgba(90,0,12,0)'); edge.addColorStop(1, 'rgba(90,0,12,0.38)');
    g.fillStyle = edge; g.fillRect(x0, 0, PW, h);
    // 中肋はわずかに明るい
    const mid = g.createLinearGradient(x0, 0, x0 + PW, 0);
    mid.addColorStop(0.42, 'rgba(255,110,110,0)');
    mid.addColorStop(0.5, `rgba(255,110,110,${k === 2 ? 0.32 : 0.2})`);
    mid.addColorStop(0.58, 'rgba(255,110,110,0)');
    g.fillStyle = mid; g.fillRect(x0, 0, PW, h);
    // 葉脈 (濃い線と、その脇の明るいハイライト)
    for (const v of V.veins) {
      g.strokeStyle = `rgba(70,0,10,${v.a})`; g.lineWidth = v.w; veinPath(g, x0, v, h, 6);
      g.strokeStyle = `rgba(255,120,120,${v.a * 0.35})`; g.lineWidth = v.w * 0.6;
      veinPath(g, x0 + 1.5, v, h, 6);
    }
    // 色素のむら (長さ方向に伸びた斑)
    for (let i = 0; i < 60; i++) {
      g.fillStyle = rng() < 0.5 ? `rgba(255,60,70,${rand(0.03, 0.08)})` : `rgba(60,0,10,${rand(0.03, 0.09)})`;
      g.beginPath(); g.ellipse(x0 + rng() * PW, rng() * h, rand(4, 18), rand(40, 160), 0, 0, 6.29); g.fill();
    }
    // 小さなしみ
    for (const sp of V.spots) {
      g.fillStyle = `rgba(${k === 3 ? '70,25,10' : '90,0,15'},${sp.a})`;
      g.beginPath(); g.ellipse(x0 + sp.x * PW, sp.y * h, sp.r, sp.r * rand(1, 2.5), 0, 0, 6.29); g.fill();
    }
    // 基部 (キャンバス下端) は淡く緑がかる
    const base = g.createLinearGradient(0, h, 0, h * 0.9);
    base.addColorStop(0, 'rgba(210,150,120,0.55)'); base.addColorStop(1, 'rgba(210,150,120,0)');
    g.fillStyle = base; g.fillRect(x0, h * 0.9, PW, h * 0.1);
    // 花粉の粒が落ちた跡
    const pollen = k === 2 ? 220 : 40;
    for (let i = 0; i < pollen; i++) {
      g.fillStyle = `rgba(240,${rand(170, 210)},80,${rand(0.3, 0.8)})`;
      g.beginPath(); g.arc(x0 + rand(0.15, 0.85) * PW, h * (1 - Math.pow(rng(), 2) * 0.35), rand(0.8, 2), 0, 6.29); g.fill();
    }
    // 褐変: 先端 (キャンバス上端) と縁
    if (k === 3) {
      const tip = g.createLinearGradient(0, 0, 0, h * 0.25);
      tip.addColorStop(0, 'rgba(60,30,15,0.85)'); tip.addColorStop(1, 'rgba(60,30,15,0)');
      g.fillStyle = tip; g.fillRect(x0, 0, PW, h * 0.25);
      for (let i = 0; i < 80; i++) {
        const side = rng() < 0.5 ? x0 + rand(0, 14) : x0 + PW - rand(0, 14);
        g.fillStyle = `rgba(70,35,15,${rand(0.15, 0.4)})`;
        g.beginPath(); g.ellipse(side, rng() * h * 0.7, rand(2, 7), rand(10, 50), 0, 0, 6.29); g.fill();
      }
    }
    g.restore();
  }
  const img = g.getImageData(0, 0, w, h);
  for (let i = 0; i < img.data.length; i += 4) {
    const n = (rng() - 0.5) * 14;
    img.data[i] += n; img.data[i + 1] += n * 0.3; img.data[i + 2] += n * 0.3;
  }
  g.putImageData(img, 0, 0);
});
const petalBump = canvasTex(PW * ATLAS, PH, (g, w, h) => {
  g.fillStyle = '#808080'; g.fillRect(0, 0, w, h);
  for (let k = 0; k < ATLAS; k++) {
    const x0 = k * PW;
    for (const v of variants[k].veins) {
      g.strokeStyle = `rgba(30,30,30,${v.a * 2.2})`; g.lineWidth = v.w * 1.5; veinPath(g, x0, v, h, 6);
    }
    const mid = g.createLinearGradient(x0, 0, x0 + PW, 0);
    mid.addColorStop(0.44, 'rgba(0,0,0,0)'); mid.addColorStop(0.5, 'rgba(0,0,0,0.45)'); mid.addColorStop(0.56, 'rgba(0,0,0,0)');
    g.fillStyle = mid; g.fillRect(x0, 0, PW, h);
    // 横方向の細かなしわ
    for (let i = 0; i < 140; i++) {
      const y = rng() * h;
      g.strokeStyle = `rgba(${rng() < 0.5 ? '40,40,40' : '210,210,210'},${rand(0.05, 0.15)})`;
      g.lineWidth = rand(0.5, 1.5);
      g.beginPath(); g.moveTo(x0 + rng() * PW * 0.3, y); g.quadraticCurveTo(x0 + PW / 2, y + rand(-10, 10), x0 + PW - rng() * PW * 0.3, y + rand(-6, 6)); g.stroke();
    }
    for (const sp of variants[k].spots) {
      g.fillStyle = `rgba(30,30,30,${sp.a})`;
      g.beginPath(); g.arc(x0 + sp.x * PW, sp.y * h, sp.r, 0, 6.29); g.fill();
    }
  }
  // 表皮細胞の細かな凹凸 (きらめき)
  const img = g.getImageData(0, 0, w, h);
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const i = (y * w + x) * 4;
    const cell = ((x >> 1) * 7 + (y >> 3) * 13) % 5 === 0 ? 10 : 0;
    const n = (rng() - 0.5) * 18 + cell;
    img.data[i] += n; img.data[i + 1] += n; img.data[i + 2] += n;
  }
  g.putImageData(img, 0, 0);
}, false);

const stemScars = [];
for (let i = 0; i < 9; i++) stemScars.push({ x: rng(), y: rand(0.05, 0.95), w: rand(2, 5), l: rand(6, 30) });
const stemMap = canvasTex(128, 1024, (g, w, h) => {
  g.fillStyle = '#4f6a2a'; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 70; i++) {
    const l = rand(-18, 14);
    g.fillStyle = `rgba(${l > 0 ? 200 : 20},${l > 0 ? 230 : 50},${l > 0 ? 160 : 10},${Math.abs(l) / 100})`;
    g.fillRect(rng() * w, 0, rand(1, 4), h);
  }
  // 気孔の細かな点
  for (let i = 0; i < 2500; i++) {
    g.fillStyle = `rgba(200,220,170,${rand(0.08, 0.3)})`;
    g.fillRect(rng() * w, rng() * h, 1, 2);
  }
  // 粉を吹いたような薄いブルーム
  for (let i = 0; i < 40; i++) {
    g.fillStyle = `rgba(190,205,180,${rand(0.04, 0.12)})`;
    g.beginPath(); g.ellipse(rng() * w, rng() * h, rand(4, 14), rand(20, 70), 0, 0, 6.29); g.fill();
  }
  // 小さな傷 (褐色の筋)
  for (const sc of stemScars) {
    g.fillStyle = 'rgba(120,95,50,0.6)';
    g.beginPath(); g.ellipse(sc.x * w, sc.y * h, sc.w / 2, sc.l / 2, 0, 0, 6.29); g.fill();
    g.fillStyle = 'rgba(60,45,20,0.5)';
    g.fillRect(sc.x * w - 0.5, sc.y * h - sc.l * 0.35, 1, sc.l * 0.7);

  {
    vec3 basePos = vec3(modelMatrix[3][0], modelMatrix[3][1], modelMatrix[3][2]);
    float ph = dot(basePos.xz, vec2(0.131, 0.077));
    float h = clamp(position.y / 42.0, 0.0, 1.3);

      sin(uWindTime * 0.55 + ph) + 0.35 * sin(uWindTime * 1.37 + ph * 1.9),

    float r = length(position.xz);

      sin(uWindTime * 1.9 + position.x * 0.35 + ph),

const smooth = (a, b, x) => { const t = THREE.MathUtils.clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };

// 花被片 (ローカル座標: +X 外向き, +Y 花の軸, Z 幅方向)
function makeTepal(o) {
  const { length, width, rise, curl, wave, waveFreq, twist, cup, segU, segV, phaseA, phaseB } = o;
  const tone = o.tone ?? 1, sweep = o.sweep ?? 0, roll = o.roll ?? 0;
  const cols = o.atlas === undefined ? 1 : ATLAS, col0 = o.atlas ?? 0;
  const pos = [], nor = [], uv = [], idx = [], col = [];
  const ds = length / segU;
  const p = new THREE.Vector3();
  const C = [], T = [];
  for (let i = 0; i <= segU; i++) {
    const u = i / segU;
    const a = rise - curl * Math.pow(u, 1.65);
    const t = new THREE.Vector3(Math.cos(a), Math.sin(a), 0);
    C.push(p.clone()); T.push(t);
    p.addScaledVector(t, ds);
  }
  // 放射面から横へそれる曲がり。接線は差分から取り直す
  if (sweep !== 0) {
    for (let i = 0; i <= segU; i++) C[i].z += sweep * length * Math.pow(i / segU, 2);
    for (let i = 0; i <= segU; i++) {
      const a = C[Math.max(0, i - 1)], b = C[Math.min(segU, i + 1)];
      T[i].subVectors(b, a).normalize();
    }
  }
  const B = new THREE.Vector3(), N = new THREE.Vector3(), q = new THREE.Quaternion(), v3 = new THREE.Vector3();
  for (let i = 0; i <= segU; i++) {
    const u = i / segU;
    const w = width * Math.pow(Math.sin(Math.PI * (0.05 + 0.95 * u)), 0.55) * (1 - 0.3 * u);
    B.set(0, 0, 1).addScaledVector(T[i], -T[i].z).normalize()
      .applyQuaternion(q.setFromAxisAngle(T[i], roll + twist * u));
    N.crossVectors(B, T[i]).normalize();
    const amp = wave * smooth(0.06, 0.3, u) * (1 - 0.45 * u);
    for (let j = 0; j <= segV; j++) {
      const s = j / segV * 2 - 1; // -1..1
      const as = Math.abs(s);
      const ph = s > 0 ? phaseA : phaseB;
      // 縁の縮れ: 主波 + 細かい不規則な波
      const ruffle = amp * Math.pow(as, 1.6) * (
        Math.sin(u * waveFreq * Math.PI * 2 + ph + as * 0.8) +
        0.45 * Math.sin(u * waveFreq * 2.37 * Math.PI * 2 + ph * 1.7) * smooth(0.5, 1, as) +
        0.08 * Math.sin(u * waveFreq * 5.1 * Math.PI * 2 + ph * 2.3) * smooth(0.75, 1, as));
      // 浅い樋状の断面と中肋の溝
      const curve = cup * w * s * s - 0.06 * w * (1 - as) - 0.035 * w * Math.exp(-(s * s) / 0.02);
      v3.copy(C[i]).addScaledVector(B, s * w * 0.5).addScaledVector(N, curve + ruffle)
        .addScaledVector(T[i], ruffle * 0.25 * s);
      pos.push(v3.x, v3.y, v3.z);
      nor.push(0, 0, 0);
      uv.push((col0 + j / segV) / cols, u);
      // 基部はやや淡く、先端と縁はわずかに濃い
      const k = tone * (1 - 0.22 * smooth(0.82, 1, u) - 0.12 * smooth(0.8, 1, as)) ;
      const pale = 0.35 * (1 - smooth(0.0, 0.1, u));
      col.push(k + pale * 0.3, k * (1 + pale * 1.6), k * (1 + pale * 1.2));
    }
  }
  const row = segV + 1;
  for (let i = 0; i < segU; i++) for (let j = 0; j < segV; j++) {
    const a = i * row + j, b = a + row, c = b + 1, d = a + 1;
    idx.push(a, b, d, b, c, d);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('normal', new THREE.Float32BufferAttribute(nor, 3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
  g.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
  g.setIndex(idx);
  g.computeVertexNormals();
  return g;
}

// 先細りのチューブ
function taperTube(points, r0, r1, tubular, radial) {
  const curve = new THREE.CatmullRomCurve3(points, false, 'centripetal');
  const frames = curve.computeFrenetFrames(tubular, false);
  const pos = [], nor = [], uv = [], idx = [];
  const P = new THREE.Vector3(), D = new THREE.Vector3();
  for (let i = 0; i <= tubular; i++) {
    const t = i / tubular;
    curve.getPointAt(t, P);
    const r = THREE.MathUtils.lerp(r0, r1, t);
    const Nn = frames.normals[i], Bn = frames.binormals[i];
    for (let j = 0; j <= radial; j++) {
      const a = j / radial * Math.PI * 2;
      D.copy(Nn).multiplyScalar(Math.cos(a)).addScaledVector(Bn, Math.sin(a));
      pos.push(P.x + D.x * r, P.y + D.y * r, P.z + D.z * r);
      nor.push(D.x, D.y, D.z);
      uv.push(j / radial, t);
    }
  }
  for (let i = 0; i < tubular; i++) for (let j = 0; j < radial; j++) {
    const a = i * (radial + 1) + j, b = a + radial + 1;
    idx.push(a, b, a + 1, b, b + 1, a + 1);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('normal', new THREE.Float32BufferAttribute(nor, 3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
  g.setIndex(idx);
  return { geo: g, curve };
}

function makeAnther(len) {

function makeOvary() {

    const x = p.getX(i), y = p.getY(i), z = p.getZ(i);

    const r = 1 + 0.13 * Math.cos(a * 3);

}

const m4 = new THREE.Matrix4();

function ellipsoid(base, center, x, y, z, sx, sy, sz) {
  m4.makeBasis(x, y, z).scale(new THREE.Vector3(sx, sy, sz)).setPosition(center);
  return base.clone().applyMatrix4(m4);
}

function perpendicular(v) {
  const a = Math.abs(v.y) < 0.9 ? UP : new THREE.Vector3(1, 0, 0);
  return new THREE.Vector3().crossVectors(v, a).normalize();
}

// 雄しべ・雌しべの軌跡: 根元から緩やかに上がり、先端側の3〜4割で強く反り上がる
const qRot = new THREE.Quaternion();
function filamentPoints(start, dir0, len, baseCurl, tipCurl, steps) {
  const pts = [start.clone()];
  const p = start.clone(), d = dir0.clone();
  const axis = new THREE.Vector3().crossVectors(dir0, UP);
  if (axis.lengthSq() < 1e-4) axis.set(1, 0, 0); else axis.normalize();
  const ds = len / steps;
  for (let i = 1; i <= steps; i++) {
    const s = (i - 0.5) / steps;
    // 先端に集中する曲率 (s^3 の重みは 0〜1 で積分すると 1)
    const dTheta = (baseCurl + tipCurl * 4 * s * s * s) / steps;
    d.applyQuaternion(qRot.setFromAxisAngle(axis, dTheta)).normalize();
    p.addScaledVector(d, ds);
    pts.push(p.clone());
  }
  return { pts, dir: d };
}

function buildFlower(G, F, A, detail) {
  const e1 = perpendicular(A);
  const e2 = new THREE.Vector3().crossVectors(A, e1).normalize();
  const segU = detail > 0.7 ? 72 : 22, segV = detail > 0.7 ? 14 : 4;

  // 子房
  G.green.push(ellipsoid(ovaryGeo, F.clone().addScaledVector(A, -0.12), e1, A, e2, 1, 1, 1));

  // 花被片 ×6
  // 花の上側 (空の方向) を基準に、上の花被片ほど強く反り返り、下の花被片は垂れる
  const flowerUp = UP.clone().addScaledVector(A, -UP.dot(A));
  if (flowerUp.lengthSq() < 1e-4) flowerUp.copy(e1); else flowerUp.normalize();
  const rot0 = rand(0, Math.PI * 2);
  for (let i = 0; i < 6; i++) {
    const phi = rot0 + i / 6 * Math.PI * 2 + rand(-0.4, 0.4);
    const X = e1.clone().multiplyScalar(Math.cos(phi)).addScaledVector(e2, Math.sin(phi));
    const Z = new THREE.Vector3().crossVectors(X, A);
    const side = X.dot(flowerUp);
    const wild = rng() < 0.2;
    const tep = makeTepal({
      length: rand(4.8, 6.4), width: rand(0.62, 0.86),
      rise: rand(0.4, 1.05) + 0.25 * side, curl: rand(2.8, 4.6) + 0.55 * side,
      wave: rand(0.1, 0.18), waveFreq: rand(6, 10),
      twist: wild ? rand(1.2, 1.8) * (rng() < 0.5 ? -1 : 1) : rand(-0.9, 0.9),
      roll: rand(-0.6, 0.6), sweep: rand(-0.35, 0.35),
      cup: rand(0.12, 0.36), segU, segV, phaseA: rand(0, 6.28), phaseB: rand(0, 6.28), tone: rand(0.9, 1.06),
      atlas: rng() < 0.12 ? 3 : Math.floor(rng() * 3),
    });
    m4.makeBasis(X, A, Z).setPosition(F.clone().addScaledVector(A, rand(0.0, 0.14)).addScaledVector(X, rand(0.03, 0.12)));
    G.petal.push(tep.applyMatrix4(m4));
  }

  // 雄しべ ×6 と 雌しべ ×1
  const horiz = new THREE.Vector3(A.x, 0, A.z).normalize();
  const lateral = new THREE.Vector3().crossVectors(UP, horiz).normalize();
  const tub = detail > 0.7 ? 56 : 14, rad = detail > 0.7 ? 8 : 4;
  for (let i = 0; i <= 6; i++) {
    const isStyle = i === 6;
    const psi = i / 6 * Math.PI * 2 + rand(-0.3, 0.3);
    const radial = e1.clone().multiplyScalar(Math.cos(psi)).addScaledVector(e2, Math.sin(psi));
    // 横方向に扇状に開き、上下の開きは小さい
    const fan = isStyle ? 0 : (i - 2.5) / 2.5;
    // ほぼ水平に扇状に開く。一部はやや下を向く
    const dir0 = A.clone().addScaledVector(UP, isStyle ? 0.05 : rand(-0.2, 0.12))
      .addScaledVector(lateral, fan * rand(0.35, 0.6)).normalize();
    const start = F.clone().addScaledVector(A, 0.15).addScaledVector(radial, isStyle ? 0 : 0.05);
    const len = isStyle ? rand(11.5, 12.5) : rand(10, 12.4);
    const { pts, dir } = filamentPoints(start, dir0, len, isStyle ? 0.08 : rand(0.0, 0.2), isStyle ? 0.6 : rand(0.45, 0.95), 30);
    const { geo } = taperTube(pts, isStyle ? 0.032 : 0.028, isStyle ? 0.02 : 0.017, tub, rad);
    const tip = pts[pts.length - 1];
    if (isStyle) {
      G.style.push(geo);
      for (let l = 0; l < 3; l++) {
        const a = l / 3 * Math.PI * 2;
        const off = e1.clone().multiplyScalar(Math.cos(a)).addScaledVector(e2, Math.sin(a));
        G.stigma.push(ellipsoid(sphereLo, tip.clone().addScaledVector(off, 0.018).addScaledVector(dir, 0.01), e1, dir, e2, 0.022, 0.03, 0.022));
      }
    } else {
      G.stamen.push(geo);
      // 丁字着の葯 (糸に対して横向き)
      const z = new THREE.Vector3().crossVectors(dir, radial).normalize();
      const x = new THREE.Vector3().crossVectors(dir, z).normalize();
      m4.makeBasis(x, dir, z).setPosition(tip.clone().addScaledVector(dir, 0.035));
      G.anther.push(makeAnther(rand(0.34, 0.42)).applyMatrix4(m4));
    }
  }
}

function buildPlant(height, detail, seedLean, flowers = 6 + Math.floor(rng() * 5)) {
  const G = { petal: [], stamen: [], style: [], anther: [], stigma: [], green: [], stem: [], bract: [] };
  // 花茎 (葉はない)
  const lean = new THREE.Vector3(rand(-1, 1), 0, rand(-1, 1)).normalize().multiplyScalar(height * seedLean);
  const pts = [];
  for (let i = 0; i <= 6; i++) {
    const t = i / 6;
    pts.push(new THREE.Vector3(lean.x * t * t + Math.sin(t * 3 + height) * 0.3, height * t, lean.z * t * t));
  }
  const { geo: stemGeo } = taperTube(pts, 0.34, 0.24, detail > 0.7 ? 80 : 20, detail > 0.7 ? 20 : 6);
  G.stem.push(stemGeo);
  const top = pts[6];
  G.green.push(ellipsoid(sphereLo, top.clone().addScaledVector(UP, 0.1), new THREE.Vector3(1, 0, 0), UP, new THREE.Vector3(0, 0, 1), 0.3, 0.28, 0.3));

  // 総苞片 (乾いた褐色) 2枚と、糸状の小苞片
  const bractPhi = rand(0, Math.PI * 2);
  for (let i = 0; i < 7; i++) {
    const big = i < 2;
    const phi = big ? bractPhi + i * Math.PI : rand(0, Math.PI * 2);
    const X = new THREE.Vector3(Math.cos(phi), 0, Math.sin(phi));
    const Z = new THREE.Vector3().crossVectors(X, UP);
    const b = makeTepal({
      length: big ? rand(1.8, 2.6) : rand(0.6, 1.1), width: big ? 0.32 : 0.06,
      rise: big ? rand(-1.1, -0.6) : rand(-0.4, 0.6), curl: rand(0.2, 0.9),
      wave: big ? 0.05 : 0.01, waveFreq: 3, twist: rand(-0.8, 0.8), cup: 0.4,
      segU: big ? 24 : 8, segV: big ? 6 : 2, phaseA: rand(0, 6), phaseB: rand(0, 6),
    });
    m4.makeBasis(X, UP, Z).setPosition(top.clone().addScaledVector(X, 0.2).addScaledVector(UP, -0.1));
    G.bract.push(b.applyMatrix4(m4));
  }

  // 散形花序
  // 1本の花茎に6〜10輪 (各花の花被片は6枚)
  const n = flowers;
  const rot = rand(0, Math.PI * 2);
  for (let k = 0; k < n; k++) {
    const phi = rot + k / n * Math.PI * 2 + rand(-0.25, 0.25);
    const out = new THREE.Vector3(Math.cos(phi), 0, Math.sin(phi));
    // 輪数が多いほど上向き・下向きの花が混ざり、球状にまとまる
    const tilt = n > 7 ? (k % 2 ? rand(1.05, 1.35) : rand(1.4, 1.65)) : rand(1.35, 1.62);
    const A = out.clone().multiplyScalar(Math.sin(tilt)).addScaledVector(UP, Math.cos(tilt)).normalize();
    const pl = rand(2.2, 3.0);
    const F = top.clone().addScaledVector(UP, 0.5).addScaledVector(out, 0.35).addScaledVector(A, pl);
    const ped = [
      top.clone(),
      top.clone().addScaledVector(UP, 0.35).addScaledVector(out, 0.1),
      top.clone().addScaledVector(UP, 0.55).addScaledVector(out, 0.4),
      F.clone().addScaledVector(A, -0.35),
      F.clone().addScaledVector(A, -0.1),
    ];
    G.green.push(taperTube(ped, 0.085, 0.06, detail > 0.7 ? 24 : 6, detail > 0.7 ? 8 : 4).geo);
    buildFlower(G, F, A, detail);
  }

  const group = new THREE.Group();
  const add = (list, mat, shadow = true) => {
    if (!list.length) return;
    const mesh = new THREE.Mesh(mergeGeometries(list), mat);
    mesh.userData.photoMat = mat;
    mesh.customDepthMaterial = mat === bractMat ? windDepthBract : windDepth;
    mesh.castShadow = shadow; mesh.receiveShadow = true;
    group.add(mesh);
    list.forEach((g) => g.dispose());
  };
  add(G.petal, petalMat);
  add(G.stamen, stamenMat);
  add(G.style, styleMat);
  add(G.anther, antherMat);
  add(G.stigma, stigmaMat, false);
  add(G.green, ovaryMat);
  add(G.stem, stemMat);
  add(G.bract, bractMat);
  group.userData.top = top.clone();
  return group;
}

// ---------- イラスト調モード ----------
// トゥーン陰影 + 深度/法線から抽出した線画 + 和紙の地
// 陰影ランプ: 光の当たり具合 (0〜1) を何段の明るさに塗り分けるか。steps = 0 はなめらかな陰影
const RAMP_W = 32;
const toonRamp = new THREE.DataTexture(new Uint8Array(RAMP_W * 4), RAMP_W, 1);
function setRamp(steps, shade) {
  const d = toonRamp.image.data, lo = 1 - shade;
  for (let i = 0; i < RAMP_W; i++) {
    const x = (i + 0.5) / RAMP_W;
    const v = steps < 1 ? lo + (1 - lo) * smooth(0.2, 0.9, x)
      : steps === 1 ? 1 : lo + (1 - lo) * Math.min(steps - 1, Math.floor(x * steps)) / (steps - 1);
    d.set([v * 255, v * 255, v * 255, 255], i * 4);
  }
  toonRamp.minFilter = toonRamp.magFilter = steps < 1 ? THREE.LinearFilter : THREE.NearestFilter;
  toonRamp.needsUpdate = true;
}
const paperTex = canvasTex(512, 512, (g, w, h) => {
  g.fillStyle = '#808080'; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 1600; i++) {
    g.strokeStyle = `rgba(${rng() < 0.5 ? '255,255,255' : '0,0,0'},${rand(0.04, 0.12)})`;
    g.lineWidth = rand(0.5, 1.4);
    const x = rng() * w, y = rng() * h, a = rng() * 6.28, l = rand(4, 22);
    g.beginPath(); g.moveTo(x, y); g.quadraticCurveTo(x + rand(-4, 4), y + rand(-4, 4), x + Math.cos(a) * l, y + Math.sin(a) * l); g.stroke();
  }
  const img = g.getImageData(0, 0, w, h);
  for (let i = 0; i < img.data.length; i += 4) {
    const n = (rng() - 0.5) * 22;
    img.data[i] += n; img.data[i + 1] += n; img.data[i + 2] += n;
  }
  g.putImageData(img, 0, 0);
}, false);

// 線の太さの重み: 細い雄しべ・雌しべは線を弱く
const inkWeights = new Map([[stamenMat, 0.3], [styleMat, 0.3], [antherMat, 0.6], [stigmaMat, 0.3]]);
const toonMats = new Map();
const normalMats = new Map();
function toonFor(mat) {
  if (!toonMats.has(mat)) {
    const t = new THREE.MeshToonMaterial({
      map: mat.map, color: mat.color, vertexColors: mat.vertexColors, side: mat.side, gradientMap: toonRamp,
      alphaMap: mat.alphaMap, alphaTest: mat.alphaTest,
    });
    addWind(t);
    toonMats.set(mat, t);
  }
  return toonMats.get(mat);
}
function normalFor(mat) {
  if (!normalMats.has(mat)) {
    normalMats.set(mat, new THREE.ShaderMaterial({
      side: THREE.DoubleSide,
      uniforms: { weight: { value: inkWeights.get(mat) ?? 1 }, alphaMap: { value: mat.alphaMap }, useAlpha: { value: mat.alphaMap ? 1 : 0 }, uWindTime: windTime },
      vertexShader: `uniform float uWindTime; varying vec3 vN; varying vec2 vUv2; void main() {
        vN = normalize(normalMatrix * normal); vUv2 = uv;
        vec3 transformed = position;
        ${WIND_GLSL}
        gl_Position = projectionMatrix * modelViewMatrix * vec4(transformed, 1.0); }`,
      fragmentShader: `uniform float weight, useAlpha; uniform sampler2D alphaMap; varying vec3 vN; varying vec2 vUv2; void main() {
        if (useAlpha > 0.5 && texture2D(alphaMap, vUv2).g < 0.5) discard;
        vec3 n = normalize(vN) * (gl_FrontFacing ? 1.0 : -1.0);
        gl_FragColor = vec4(n * 0.5 + 0.5, weight); }`,
    }));
  }
  return normalMats.get(mat);
}
const meshes = [];
lily.traverse((o) => { if (o.isMesh) meshes.push(o); });
function useMaterials(kind) {
  for (const m of meshes) {
    const base = m.userData.photoMat;
    m.material = kind === 'toon' ? toonFor(base) : kind === 'normal' ? normalFor(base) : base;
  }
}

const size = new THREE.Vector2();
const colorRT = new THREE.WebGLRenderTarget(1, 1, { type: THREE.HalfFloatType, samples: 4 });
const normalRT = new THREE.WebGLRenderTarget(1, 1, { type: THREE.HalfFloatType });
normalRT.depthTexture = new THREE.DepthTexture(1, 1, THREE.FloatType);
function resizeTargets() {
  renderer.getDrawingBufferSize(size);
  colorRT.setSize(size.x, size.y);
  normalRT.setSize(size.x, size.y);
  inkQuad.material.uniforms.resolution.value.copy(size);
  inkQuad.material.uniforms.dpr.value = renderer.getPixelRatio();
}

const inkQuad = new FullScreenQuad(new THREE.ShaderMaterial({
  uniforms: {
    tColor: { value: colorRT.texture }, tNormal: { value: normalRT.texture }, tDepth: { value: normalRT.depthTexture },
    tPaper: { value: paperTex }, resolution: { value: new THREE.Vector2() }, dpr: { value: 1 },
    cameraNear: { value: camera.near }, cameraFar: { value: camera.far },
    paperColor: { value: new THREE.Color() }, inkColor: { value: new THREE.Color() },
    lineScale: { value: 1 }, lineStrength: { value: 1 }, wobble: { value: 0 },
    saturation: { value: 1 }, posterize: { value: 0 }, mono: { value: 0 }, keepRed: { value: 0 },
    paperStrength: { value: 0 }, granStrength: { value: 0 }, bleed: { value: 0 }, edgeDarken: { value: 0 },
    hatchStrength: { value: 0 }, crossHatch: { value: 0 }, halftone: { value: 0 },
  },
  vertexShader: `varying vec2 vUv; void main() { vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }`,
  fragmentShader: `
    #include <packing>
    uniform sampler2D tColor, tNormal, tDepth, tPaper;
    uniform vec2 resolution; uniform float dpr, cameraNear, cameraFar;
    uniform vec3 paperColor, inkColor;
    uniform float lineScale, lineStrength, wobble, saturation, posterize, mono, keepRed;
    uniform float paperStrength, granStrength, bleed, edgeDarken, hatchStrength, crossHatch, halftone;
    varying vec2 vUv;
    float depthAt(vec2 uv) { return -perspectiveDepthToViewZ(texture2D(tDepth, uv).x, cameraNear, cameraFar); }
    void main() {
      vec2 texel = 1.0 / resolution;
      // 手描きの揺らぎ: 紙のノイズで参照位置をずらす
      vec2 nz = vec2(texture2D(tPaper, vUv * resolution / (900.0 * dpr)).r,
                     texture2D(tPaper, vUv * resolution / (900.0 * dpr) + 0.41).r) - 0.5;
      vec2 uvL = vUv + nz * wobble * 6.0 * dpr * texel;

      // 輪郭線: 深度の段差と法線の折れ目を検出
      vec2 px = lineScale * dpr * texel;
      float dC = depthAt(uvL);
      vec4 nC = texture2D(tNormal, uvL);
      float dEdge = 0.0, nEdge = 0.0, w = nC.a;
      for (int i = 0; i < 8; i++) {
        float a = float(i) * 0.785398;
        vec2 uv = uvL + vec2(cos(a), sin(a)) * px;
        float d = depthAt(uv);
        vec4 n = texture2D(tNormal, uv);
        dEdge = max(dEdge, abs(d - dC) / min(d, dC));
        nEdge = max(nEdge, length(n.rgb - nC.rgb) * step(0.01, n.a * nC.a));
        w = max(w, n.a);
      }
      float edge = max(smoothstep(0.04, 0.12, dEdge), smoothstep(0.35, 0.7, nEdge));
      float ink = edge * w * step(0.05, lineScale);

      // 色: にじみ (ずらし + ぼかし) で塗りが線からはみ出す
      vec2 bo = nz * bleed * 10.0 * dpr * texel;
      vec4 c = texture2D(tColor, vUv + bo);
      if (bleed > 0.01) {
        float r = bleed * 2.5 * dpr;
        c = (c * 2.0 + texture2D(tColor, vUv + bo + vec2(r, r) * texel) + texture2D(tColor, vUv + bo + vec2(-r, r) * texel)
           + texture2D(tColor, vUv + bo + vec2(r, -r) * texel) + texture2D(tColor, vUv + bo + vec2(-r, -r) * texel)) / 6.0;
      }
      // ぼかしで背景 (透明) と混ざった分を戻す
      vec3 base = c.rgb / max(c.a, 1e-3);
      float v = max(base.r, max(base.g, base.b));
      if (posterize > 0.5) {
        vec3 g = pow(max(base, 0.0), vec3(1.0 / 2.2));
        base = pow(floor(g * posterize + 0.5) / posterize, vec3(2.2));
      }
      float l = dot(base, vec3(0.299, 0.587, 0.114));
      vec3 col = mix(vec3(l), base, saturation);
      // モノクロ化。keepRed で朱だけ残す
      float redness = smoothstep(0.05, 0.25, base.r - max(base.g, base.b));
      col = mix(col, vec3(l) * vec3(1.0, 0.97, 0.93), mono * (1.0 - keepRed * redness));

      // 紙の質感と顔料のざらつき
      float paper = texture2D(tPaper, vUv * resolution / (512.0 * dpr)).r;
      float gran = texture2D(tPaper, vUv * resolution / (160.0 * dpr) + 0.37).r;
      col *= 1.0 + paperStrength * (paper - 0.5) * 0.8 + granStrength * (gran - 0.5) * 0.9;
      // 水彩の縁だまり
      col *= 1.0 - edgeDarken * 0.5 * clamp(edge * 1.5, 0.0, 1.0);

      vec3 bg = paperColor * (1.0 + paperStrength * (paper - 0.5) * 0.6);
      vec3 outc = mix(bg, col, clamp(c.a, 0.0, 1.0));

      // 斜線 (暗い面) と交差線 (さらに暗い面)
      vec2 fc = gl_FragCoord.xy / dpr;
      float h1 = 1.0 - smoothstep(0.0, 0.18, abs(fract((fc.x + fc.y) / 6.0) - 0.5) * 2.0 - 0.75);
      float h2 = 1.0 - smoothstep(0.0, 0.18, abs(fract((fc.x - fc.y) / 6.0) - 0.5) * 2.0 - 0.75);
      float hatch = h1 * (1.0 - smoothstep(0.16, 0.3, v)) + crossHatch * h2 * (1.0 - smoothstep(0.05, 0.12, v));
      outc = mix(outc, inkColor * 1.3, clamp(hatch * c.a * (0.7 + 0.3 * paper), 0.0, 1.0) * hatchStrength * 0.6);

      // 網点: 暗いほど大きな点
      vec2 hg = mat2(0.7071, -0.7071, 0.7071, 0.7071) * fc / 6.0;
      float dark = 1.0 - smoothstep(0.06, 0.5, v);
      float rad = 0.55 * sqrt(dark);
      float dotm = 1.0 - smoothstep(rad - 0.06, rad + 0.02, length(fract(hg) - 0.5));
      outc = mix(outc, inkColor, dotm * halftone * clamp(c.a, 0.0, 1.0) * 0.85);

      outc = mix(outc, inkColor, clamp(ink, 0.0, 1.0) * lineStrength);
      gl_FragColor = vec4(outc, 1.0);
      #include <colorspace_fragment>
    }`,
}));
resizeTargets();
window.addEventListener('resize', resizeTargets);

// ---------- シネマモード ----------

);
backdrop.material.uniforms.cTop.value.convertSRGBToLinear();

// 照明: 背後上方からの青白い月光 (縁取りと透過)、正面上からの白いキー、足元の赤い照り返し

moon.position.copy(top).addScaledVector(moonDir, 80);
moon.target.position.copy(top);
const key = new THREE.SpotLight(0xfff1e6, 5, 0, 0.42, 0.85, 0);

key.target.position.copy(top);

// 浮遊する塵 (ボケて光の粒になる)
const dust = (() => {
  const N = 380, pos = new Float32Array(N * 3);
  for (let i = 0; i < N; i++) {
    pos[i * 3] = top.x + rand(-40, 40); pos[i * 3 + 1] = top.y + rand(-14, 26); pos[i * 3 + 2] = top.z + rand(-50, 25);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  const dot = canvasTex(64, 64, (c, w, h) => {
    const r = c.createRadialGradient(w / 2, h / 2, 0, w / 2, h / 2, w / 2);
    r.addColorStop(0, 'rgba(255,240,220,1)'); r.addColorStop(0.4, 'rgba(255,220,190,0.35)'); r.addColorStop(1, 'rgba(255,220,190,0)');
    c.fillStyle = r; c.fillRect(0, 0, w, h);
  });
  return new THREE.Points(g, new THREE.PointsMaterial({
    map: dot, size: 0.35, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, color: 0xffe2c8,
  }));
})();
cinema.add(dust);

// 奥の群生と手前のボケ (初めてシネマを開いたときに生成)
const companions = [];
let fieldBuilt = false;
function buildField() {
  if (fieldBuilt) return;
  fieldBuilt = true;
  const spots = [
    [-20, -14, 36, 1], [18, -22, 46, 1], [-7, -38, 40, 0.5], [30, -8, 33, 0.5], [-34, -28, 44, 0.5],
    [-30, 4, 30, 0.5],
  ];
  for (let i = 0; i < 26; i++) {
    spots.push([rand(-110, 110), rand(-45, -160), rand(32, 48), 0.5]);
  }
  for (const [x, z, h, d] of spots) {
    const p = buildPlant(h + rand(-2, 2), d, 0.06);
    p.position.set(top.x + x, 0, top.z + z);
    p.userData.phase = rand(0, 10);
    cinema.add(p);
    companions.push(p);
  }
}

const cinemaTrans = { dir: moonDir.clone(), color: new THREE.Color(0xc4d8ff).multiplyScalar(5.5) };
const studioTrans = { dir: transUniforms.uSunDir.value.clone(), color: transUniforms.uSunColor.value.clone() };
const allPhotoMats = [petalMat, stamenMat, styleMat, antherMat, stigmaMat, stemMat, ovaryMat, bractMat];
allPhotoMats.forEach((m) => { m.userData.envBase = m.envMapIntensity; });

// ポストプロセス: 被写界深度 → ブルーム → 色調 (寒色の影、ビネット、粒子) → 出力
const composer = new EffectComposer(renderer, new THREE.WebGLRenderTarget(1, 1, { type: THREE.HalfFloatType, samples: 4 }));
composer.addPass(new RenderPass(scene, camera));
const bokeh = new BokehPass(scene, camera, { focus: 26, aperture: 0.00032, maxblur: 0.012 });
composer.addPass(bokeh);
addWind(bokeh.materialDepth);
const bloom = new UnrealBloomPass(new THREE.Vector2(1, 1), 0.42, 0.55, 0.85);
composer.addPass(bloom);
const grade = new ShaderPass({
  uniforms: { tDiffuse: { value: null }, time: { value: 0 } },
  vertexShader: `varying vec2 vUv; void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
  fragmentShader: `uniform sampler2D tDiffuse; uniform float time; varying vec2 vUv;
    float hash(vec2 p) { return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453); }
    void main() {
      vec3 c = texture2D(tDiffuse, vUv).rgb;
      float l = dot(c, vec3(0.2126, 0.7152, 0.0722));
      c = mix(vec3(l), c, 1.12);
      c *= mix(vec3(0.82, 0.93, 1.18), vec3(1.0), smoothstep(0.0, 0.35, l));
      float d = distance(vUv, vec2(0.5));
      c *= mix(1.0, 0.35, smoothstep(0.4, 0.9, d));
      c += (hash(vUv * 1000.0 + time) - 0.5) * 0.018 * (0.4 + l);
      gl_FragColor = vec4(max(c, 0.0), 1.0);
    }`,
});
composer.addPass(grade);
composer.addPass(new OutputPass());
function resizeComposer() {
  composer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  composer.setSize(window.innerWidth, window.innerHeight);
}
resizeComposer();
window.addEventListener('resize', resizeComposer);

// ---------- イラストのタッチ ----------
// line: 線の太さ(px) / lineStrength: 線の濃さ / wobble: 線の揺らぎ / steps: 陰影の段数 (0 はなめらか)
// shade: 影の濃さ / saturation: 彩度 / paper: 紙の質感 / bleed: にじみ / hatch: 斜線 / halftone: 網点
// mono: モノクロ度 / keepRed: モノクロでも朱を残す / posterize: 色数の制限 / edgeDarken: 水彩の縁だまり
const TOUCHES = {
  nihonga: { line: 1, lineStrength: 0.92, wobble: 0, steps: 4, shade: 0.65, saturation: 1.25, paper: 0.2, gran: 0.12, bleed: 0,
    hatch: 0.6, cross: 1, halftone: 0, mono: 0, keepRed: 0, posterize: 0, edgeDarken: 0, ink: 0x3a1a12, paperColor: 0xf6efe2 },
  anime: { line: 1.6, lineStrength: 1, wobble: 0, steps: 2, shade: 0.45, saturation: 1.35, paper: 0, gran: 0, bleed: 0,
    hatch: 0, cross: 0, halftone: 0, mono: 0, keepRed: 0, posterize: 0, edgeDarken: 0, ink: 0x1e0a0a, paperColor: 0xfdfbf7 },
  watercolor: { line: 0.8, lineStrength: 0.3, wobble: 1.6, steps: 0, shade: 0.55, saturation: 1.05, paper: 0.35, gran: 0.4, bleed: 1,
    hatch: 0, cross: 0, halftone: 0, mono: 0, keepRed: 0, posterize: 0, edgeDarken: 0.7, ink: 0x7a2a22, paperColor: 0xfbf8f1 },
  pencil: { line: 1, lineStrength: 0.75, wobble: 1, steps: 3, shade: 0.7, saturation: 0, paper: 0.45, gran: 0.2, bleed: 0,
    hatch: 1, cross: 1, halftone: 0, mono: 1, keepRed: 0, posterize: 0, edgeDarken: 0, ink: 0x2b2b2b, paperColor: 0xf3f1ec },
  sumi: { line: 2, lineStrength: 0.95, wobble: 0.8, steps: 3, shade: 0.75, saturation: 1.3, paper: 0.35, gran: 0.25, bleed: 0.4,
    hatch: 0, cross: 0, halftone: 0, mono: 1, keepRed: 1, posterize: 0, edgeDarken: 0.3, ink: 0x141210, paperColor: 0xf1ead9 },
  comic: { line: 2.2, lineStrength: 1, wobble: 0, steps: 3, shade: 0.6, saturation: 1.6, paper: 0.08, gran: 0, bleed: 0,
    hatch: 0, cross: 0, halftone: 0.8, mono: 0, keepRed: 0, posterize: 4, edgeDarken: 0, ink: 0x0d0d12, paperColor: 0xfff6dc },
};
const SLIDERS = [
  ['line', '線の太さ', 0, 3, 0.1], ['lineStrength', '線の濃さ', 0, 1, 0.05], ['wobble', '線の揺らぎ', 0, 3, 0.1],
  ['steps', '陰影の段数', 0, 6, 1], ['shade', '影の濃さ', 0, 0.9, 0.05], ['saturation', '彩度', 0, 2, 0.05],
  ['paper', '紙の質感', 0, 1, 0.05], ['bleed', 'にじみ', 0, 1.5, 0.05], ['hatch', '斜線', 0, 1, 0.05],
  ['halftone', '網点', 0, 1, 0.05], ['mono', 'モノクロ', 0, 1, 0.05],
];
const touch = { ...TOUCHES.nihonga };
const touchPanel = document.getElementById('touch');
const presetButtons = touchPanel.querySelectorAll('[data-touch]');
const sliderBox = document.getElementById('touch-sliders');
const sliderEls = {};
const fmt = (k, v) => (k === 'steps' ? (v < 1 ? 'なめらか' : `${v} 段`) : Number(v).toFixed(2));
for (const [key, label, min, max, step] of SLIDERS) {
  const row = document.createElement('div');
  row.className = 'slider';
  row.innerHTML = `<label for="t-${key}">${label}</label><output id="t-${key}-out" for="t-${key}"></output>
    <input type="range" id="t-${key}" min="${min}" max="${max}" step="${step}">`;
  sliderBox.appendChild(row);
  const input = row.querySelector('input'), out = row.querySelector('output');
  sliderEls[key] = { input, out };
  input.addEventListener('input', () => {
    touch[key] = Number(input.value);
    presetButtons.forEach((b) => b.setAttribute('aria-pressed', 'false'));
    applyTouch();
  });
}
function applyTouch() {
  const u = inkQuad.material.uniforms;
  u.lineScale.value = touch.line; u.lineStrength.value = touch.lineStrength; u.wobble.value = touch.wobble;
  u.saturation.value = touch.saturation; u.posterize.value = touch.posterize;
  u.mono.value = touch.mono; u.keepRed.value = touch.keepRed;
  u.paperStrength.value = touch.paper; u.granStrength.value = touch.gran; u.bleed.value = touch.bleed;
  u.edgeDarken.value = touch.edgeDarken; u.hatchStrength.value = touch.hatch; u.crossHatch.value = touch.cross;
  u.halftone.value = touch.halftone;
  u.inkColor.value.setHex(touch.ink).convertSRGBToLinear();
  u.paperColor.value.setHex(touch.paperColor).convertSRGBToLinear();
  setRamp(touch.steps, touch.shade);
  for (const [key] of SLIDERS) {
    sliderEls[key].input.value = touch[key];
    sliderEls[key].out.value = fmt(key, touch[key]);
  }
}
function selectTouch(name) {
  Object.assign(touch, TOUCHES[name]);
  presetButtons.forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.touch === name)));
  applyTouch();
}
presetButtons.forEach((b) => b.addEventListener('click', () => selectTouch(b.dataset.touch)));
selectTouch('nihonga');

let mode = 'photo';
const modeButtons = document.querySelectorAll('[data-mode]');
function setMode(next) {
  const prev = mode;
  mode = next;
  const isCinema = mode === 'cinema';
  document.body.classList.toggle('illust', mode === 'illust');
  document.body.classList.toggle('cinema', isCinema);
  touchPanel.hidden = mode !== 'illust';
  modeButtons.forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.mode === mode)));
  useMaterials(mode === 'illust' ? 'toon' : 'photo');
  ambient.intensity = mode === 'illust' ? 1.6 : 0;
  scene.environment = mode === 'illust' ? null : envTex;
  if (isCinema) buildField();
  cinema.visible = isCinema;
  studioLights.forEach((l) => { l.visible = !isCinema; });
  const t = isCinema ? cinemaTrans : studioTrans;
  transUniforms.uSunDir.value.copy(t.dir);
  transUniforms.uSunColor.value.copy(t.color);
  allPhotoMats.forEach((m) => { m.envMapIntensity = m.userData.envBase * (isCinema ? 0.3 : 1); });
  antherMat.emissive.set(isCinema ? 0x7a5520 : 0x000000);
  stigmaMat.emissive.set(isCinema ? 0x221010 : 0x000000);
  renderer.toneMappingExposure = isCinema ? 1.0 : 0.8;
  // シネマに入るときは見上げる構図に
  if (isCinema && prev !== 'cinema') {
    controls.target.set(top.x, top.y + 2.5, top.z);
    camera.position.set(top.x + 11, top.y - 1.5, top.z + 32);
  }
}
modeButtons.forEach((b) => b.addEventListener('click', () => setMode(b.dataset.mode)));
window.addEventListener('keydown', (e) => {
  if (e.key === '1') setMode('cinema');
  if (e.key === '2') setMode('photo');
  if (e.key === '3' || e.key === 'i' || e.key === 'I') setMode('illust');
});
setMode('cinema');

// ---------- 描画 ----------
const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  controls.update();
  const t = clock.getElapsedTime();
  windTime.value = t;
  if (mode === 'cinema') {
    dust.rotation.y = t * 0.01;
    dust.position.y = Math.sin(t * 0.3) * 0.6;
    bokeh.uniforms.focus.value = camera.position.distanceTo(controls.target);
    grade.uniforms.time.value = t % 100;
    composer.render();
    return;
  }
  if (mode !== 'illust') {
    renderer.render(scene, camera);
    return;
  }
  renderer.setRenderTarget(colorRT);
  renderer.setClearColor(0x000000, 0);
  renderer.clear();
  renderer.render(scene, camera);
  useMaterials('normal');
  renderer.shadowMap.autoUpdate = false;
  renderer.setRenderTarget(normalRT);
  renderer.clear();
  renderer.render(scene, camera);
  renderer.shadowMap.autoUpdate = true;
  useMaterials('toon');
  renderer.setRenderTarget(null);
  inkQuad.render(renderer);
});
requestAnimationFrame(() => document.getElementById('loading').classList.add('done'));
</script>
</body>
</html>
